# Public BBZQ endpoints. Each process remains isolated behind its own Resin
# platform through the instance-specific environment file.
server {
    listen 3101;
    server_name _;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13101; }
}

server {
    listen 3102;
    server_name _;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13102; }
}

server {
    listen 3103;
    server_name _;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13103; }
}

# Direct HTTPS endpoints for BBZQ clients configured with the server IP.
# Keep the Cloudflare Tunnel origins above on plain HTTP; it terminates TLS at
# the edge and still connects to 3101-3103 locally.
server {
    listen 3441 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/bbzq-origin-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/bbzq-origin-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13101; }
}

server {
    listen 3442 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/bbzq-origin-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/bbzq-origin-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13102; }
}

server {
    listen 3443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/bbzq-origin-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/bbzq-origin-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/biliroaming-proxy.conf;
    location / { proxy_pass http://127.0.0.1:13103; }
}
